# ======================================================================== #
#                      STORAGE GUI LAYOUT CONFIGURATION                    #
# ======================================================================== #
# Configuration version – do not modify this value
gui_layout_version: 1.6.6

# ------------------------------------------------------------------------ #
#                               SLOT SETTINGS                              #
# ------------------------------------------------------------------------ #
# Slot positions: 1-9 corresponds to inventory slots 46-54 (bottom row)
# Valid materials: https://jd.papermc.io/paper/1.21.8/org/bukkit/Material.html
#
# Format Guide:
#   slot_X:                  # X = slot number (1-9)
#     material: NAME         # Material to display (use PLAYER_HEAD for spawner mob)
#     enabled: true/false    # Show/hide button
#     info_button: true      # (Optional) Mark as mob-head info button (shows loot list)
#     click: "action"        # Action for any click (left/right/shift)
#     if:                    # (Optional) Conditional actions
#       condition_name:
#         click: "action"    # Actions when condition is met
#
# Conditions:
#   sell_integration:        # Apply when sell/shop integration is ENABLED
#   no_sell_integration:     # Apply when sell/shop integration is DISABLED
#
# Available Actions:
#   previous_page            # Go to previous page
#   next_page                # Go to next page
#   sort_items               # Sort items in storage
#   open_filter              # Open filter configuration
#   sell_all                 # Sell all items (no exp collection)
#   sell_and_exp             # Sell all items and collect exp
#   collect_exp              # Collect stored experience only
#   return_main              # Return to main menu
#   take_all                 # Take all items from current page
#   drop_page                # Drop all items from current page
#   bulk_withdraw            # Open the bulk withdraw screen
#   close                    # Close the menu
#   none                     # Display only, no action (use with info_button: true)
#
# PLAYER_HEAD is honoured as "use this spawner's own icon" - the mob head slot.
# Any slot you leave out is filled with a plain panel.
# ------------------------------------------------------------------------ #

# -> Previous Page
slot_1:
  material: ARROW
  enabled: true
  click: previous_page

# -> Sell / Take All (Conditional)
slot_4:
  material: GOLD_INGOT
  enabled: true
  if:
    sell_integration:
      click: sell_and_exp
    no_sell_integration:
      material: SPECTRAL_ARROW
      click: take_all

# -> Spawner Mob Head (Info)
slot_5:
  material: PLAYER_HEAD
  enabled: true
  info_button: true
  click: none

# -> Drop Page Items
slot_6:
  material: DROPPER
  enabled: true
  click: drop_page

# -> Next Page
slot_9:
  material: ARROW
  enabled: true
  click: next_page
