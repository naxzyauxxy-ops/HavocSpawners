# ============================================================================
#  HavocSpawners - chat messages (MiniMessage format)
#  https://docs.advntr.dev/minimessage/format.html
#
#  House theme: red (#ff2b3d) on white (#ffffff).
#  Muted text  #9b9ba1   ·   soft red #ff8a95   ·   body text #e8e8ea
#
#  Placeholders are written as <name> and are listed above each message.
#  Dialog colours live in the theme: block of config.yml.
# ============================================================================

prefix: "<gradient:#ff2b3d:#ffffff><bold>Havoc</bold></gradient> <dark_gray>»</dark_gray> "

no-permission: "<color:#ff2b3d>You do not have permission to do that.</color>"
players-only: "<color:#ff2b3d>Only players can run that.</color>"
player-not-found: "<color:#ff2b3d>No online player called <white><player></white>.</color>"
inventory-full: "<color:#ff8a95>Your inventory is full.</color>"
reloaded: "<color:#ffffff>Configuration <color:#ff2b3d>reloaded</color>.</color>"

# ---------------------------------------------------------------- storage
storage:
  empty: "<color:#ff8a95>There is nothing to take.</color>"
  # <amount> <item>
  withdrew: "<color:#ffffff>Took <color:#ff2b3d><amount></color> <color:#ff2b3d><item></color>.</color>"

# ---------------------------------------------------------------- economy
economy:
  unavailable: "<color:#ff2b3d>Selling is unavailable - no economy plugin is hooked.</color>"

sell:
  nothing: "<color:#ff8a95>Nothing in there has a sell price.</color>"
  # <items> <money>
  success: "<color:#ffffff>Sold <color:#ff2b3d><items></color> items for <color:#ff2b3d><money></color>.</color>"

exp:
  empty: "<color:#ff8a95>No experience stored yet.</color>"
  # <exp>
  claimed: "<color:#ffffff>Claimed <color:#ff2b3d><exp></color> experience.</color>"

# ---------------------------------------------------------------- stacking
stack:
  cannot-add: "<color:#ff8a95>Nothing to add - either you have no matching spawners or it is already full.</color>"
  cannot-remove: "<color:#ff8a95>A spawner must keep at least one stack.</color>"
  wrong-type: "<color:#ff2b3d>That spawner is a different type.</color>"
  full: "<color:#ff8a95>This spawner is at its stack limit.</color>"
  # <amount> <total>
  added: "<color:#ffffff>Added <color:#ff2b3d><amount></color> <color:#9b9ba1>·</color> now stacked <color:#ff2b3d><total></color>.</color>"
  removed: "<color:#ffffff>Removed <color:#ff2b3d><amount></color> <color:#9b9ba1>·</color> now stacked <color:#ff2b3d><total></color>.</color>"

# ---------------------------------------------------------------- upgrades
upgrade:
  # <cost>
  too-poor: "<color:#ff2b3d>You need <white><cost></white> for that upgrade.</color>"
  # <tier> <level>
  success: "<color:#ffffff>Upgraded to <color:#ff2b3d><tier></color> (level <color:#ff2b3d><level></color>).</color>"

# ---------------------------------------------------------------- automation
automation:
  needs-hopper: "<color:#ff8a95>Place a <color:#ff2b3d>hopper</color> directly under the spawner first.</color>"

# ---------------------------------------------------------------- networks
network:
  create-failed: "<color:#ff2b3d>Could not create that network - check the name and your network limit.</color>"
  # <name>
  created: "<color:#ffffff>Created network <color:#ff2b3d><name></color>.</color>"
  assign-failed: "<color:#ff2b3d>Could not assign this spawner to that network.</color>"
  assigned: "<color:#ffffff>Assigned to <color:#ff2b3d><name></color>.</color>"
  deleted: "<color:#ff8a95>Deleted network <white><name></white>.</color>"
  # <count>
  drain-started: "<color:#ffffff>Draining <color:#ff2b3d><count></color> spawners - items arrive as they are converted.</color>"
  autosell-on: "<color:#ffffff>Auto-sell <color:#ff2b3d>enabled</color> for the whole network.</color>"
  autosell-off: "<color:#ff8a95>Auto-sell disabled for the whole network.</color>"

# ---------------------------------------------------------------- bulk drop
bulk-drop:
  # <items> <pages>  (action bar, no prefix)
  progress: "<color:#ff2b3d>⇩</color> <white><items></white> <color:#9b9ba1>items · <pages> pages left</color>"
  # <items> <seconds>
  done: "<color:#ffffff>Withdrew <color:#ff2b3d><items></color> items in <color:#ff2b3d><seconds></color>.</color>"
  busy: "<color:#ff8a95>A withdrawal is already running on that spawner.</color>"
  nothing: "<color:#ff8a95>There is nothing to withdraw.</color>"
  # <pages>
  started: "<color:#ffffff>Throwing out <color:#ff2b3d><pages></color> pages...</color>"

# ---------------------------------------------------------------- spawners
spawner:
  # <type> <stack>
  placed: "<color:#ffffff>Placed a <color:#ff2b3d><type></color> spawner <color:#9b9ba1>(×<stack>)</color>.</color>"
  # <type> <stack> <items>  - the item was carrying storage
  placed-restored: "<color:#ffffff>Placed a <color:#ff2b3d><type></color> spawner <color:#9b9ba1>(×<stack>)</color> with <color:#ff2b3d><items></color> items restored.</color>"
  # <type> <stack> <items>
  broken: "<color:#ff8a95>Broke a <white><type></white> spawner <color:#9b9ba1>(×<stack>)</color>.</color>"
  # <type> <stack> <items>  - contents travelled inside the item, nothing was dropped
  broken-carried: "<color:#ff8a95>Broke a <white><type></white> spawner <color:#9b9ba1>(×<stack>)</color> - <color:#ffffff><items></color> items are stored inside it.</color>"
  break-disabled: "<color:#ff2b3d>Breaking spawners is disabled.</color>"
  wrong-tool: "<color:#ff2b3d>You need a stronger pickaxe for that.</color>"
  needs-silk: "<color:#ff2b3d>You need Silk Touch to collect this spawner.</color>"
  busy: "<color:#ff8a95>Wait for the running withdrawal to finish first.</color>"
  natural-protected: "<color:#ff2b3d>Natural spawners cannot be broken here.</color>"
  # <type>
  type-changed: "<color:#ffffff>Spawner type changed to <color:#ff2b3d><type></color>.</color>"
  bad-egg: "<color:#ff2b3d>That egg is not a valid spawner type.</color>"
  empty-first: "<color:#ff8a95>Empty the storage before changing the spawner type.</color>"

# ---------------------------------------------------------------- commands
list:
  world-missing: "<color:#ff2b3d>That spawner's world is not loaded.</color>"
  teleported: "<color:#ffffff>Teleported.</color>"

near:
  # <count> <radius>
  header: "<color:#ffffff>Found <color:#ff2b3d><count></color> spawners within <color:#ff2b3d><radius></color> blocks:</color>"

info:
  none: "<color:#ff8a95>Look at a Havoc spawner within 8 blocks.</color>"

give:
  # All of these are accepted, including the old SmartSpawner shop syntax:
  #   /hs give Steve mob ZOMBIE 3
  #   /spawner give Steve zombie 3
  #   /spawner give spawner Steve zombie 3
  #   /spawner give item_spawner Steve bone_block 3
  usage: "<color:#ff8a95>/hs give [player] (mob|item) [TYPE] [amount] [stack] [level]</color>"
  # <player> <type> <amount>
  success: "<color:#ffffff>Gave <color:#ff2b3d><amount></color>× <color:#ff2b3d><type></color> spawner to <white><player></white>.</color>"
  bad-type: "<color:#ff2b3d>Unknown entity type: <white><value></white>.</color>"
  bad-material: "<color:#ff2b3d>Unknown material: <white><value></white>.</color>"

import:
  usage: "<color:#ff8a95>/hs import (yaml | sqlite | mysql)</color>"
  # <mode>
  started: "<color:#ffffff>Importing SmartSpawner data (<color:#ff2b3d><mode></color>)...</color>"
  # <imported> <skipped> <failed> <items>
  done: "<color:#ffffff>Import finished: <color:#ff2b3d><imported></color> imported, <color:#ff2b3d><skipped></color> skipped, <color:#ff2b3d><failed></color> failed, <color:#ff2b3d><items></color> items moved.</color>"

clearghosts:
  # <count>
  done: "<color:#ffffff>Removed <color:#ff2b3d><count></color> ghost spawners.</color>"

# ---------------------------------------------------------------- items
item:
  # <type> <stack> <level>
  spawner-name: "<gradient:#ff2b3d:#ffffff><bold><type> Spawner</bold></gradient>"
  # <items> <exp>  - extra lore lines shown only when the item is carrying storage
  spawner-contents: "<color:#9b9ba1>Holding</color> <color:#ff2b3d><items></color> <color:#9b9ba1>items</color>\n<color:#6e6e74><italic>Place it to get them back.</italic></color>"
  spawner-lore: "<color:#9b9ba1>Stacked</color> <color:#ffffff>×<stack></color>\n<color:#9b9ba1>Tier</color> <color:#ff2b3d><level></color>\n<color:#6e6e74><italic>Place it, then right-click to open.</italic></color>"
