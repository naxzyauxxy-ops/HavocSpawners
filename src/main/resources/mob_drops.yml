# ============================================================================
#  HavocSpawners - mob spawner loot tables
#
#  <ENTITY_TYPE>:
#    material: icon shown in dialogs
#    experience: XP granted per simulated mob
#    loot:
#      <MATERIAL>:
#        amount: "0-2"     (fixed value or range)
#        chance: 100.0     (percent)
#
#  Each spawn cycle simulates between min-mobs and max-mobs mobs, scaled by the
#  spawner's stack size, then rolls this table once per simulated mob.
# ============================================================================

